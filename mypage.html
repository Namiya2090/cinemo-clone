<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/mypage.css" />
    <title>Cinemo - My Page</title>
  </head>
  <body>
    <header>
      <div class="header">
        <p class="logo">CINEMO</p>
        <article class="header-menu">
          <p>홈</p>
          <p>영화</p>
          <p>시리즈</p>
          <p>내가 찜한 콘텐츠</p>
        </article>
        <article>
          <p>욜로의 마이페이지</p>
        </article>
      </div>
    </header>
    <div class="mypage">
      <p>MY CINEMO</p>
      <h1>마이페이지</h1>
      <p>취향을 모으고, 나만의 시간을 이어가세요.</p>
    </div>
    <div class="profile-box">
      <h2>욜로</h2>
      <p>기본 프로필</p>
      <p>나만의 영화 노트</p>
      <p>2026년 10월부터 함께하는 중</p>
      <article class="profile-change">
        <p>프로필 변경</p>
      </article>
    </div>
    <div class="like-content">
      <h2>내가 찜한 콘텐츠</h2>
      <article class="quiet-orbit">
        <img src="./assets/images/Image quiet-orbit.png" />
        <p>고요의 궤도</p>
        <p>SF · 미스터리 · 15+</p>
      </article>
      <article class="blue-hour">
        <img src="./assets/images/Image blue-hour.png" />
        <p>파란 시간</p>
        <p>로맨스 · 드라마 · 12+</p>
      </article>
      <article class="forest-letter">
        <img src="./assets/images/Image forest-letter.png" />
        <p>숲에서 온 편지</p>
        <p>판타지 · 드라마 · 전체</p>
      </article>
      <article class="night-diver">
        <img src="./assets/images/Image night-diver.png" />
        <p>밤의 잠수부</p>
        <p>스릴러 · 미스터리 · 15+</p>
      </article>
    </div>
  </body>
</html>
