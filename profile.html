<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/profile.css" />
    <title>Profile</title>
  </head>
  <body>
    <header>
      <h1>CINEMO</h1>
    </header>

    <main class="profile-container">
      <h2>누구의 시간인가요?</h2>
      <p class="subtitle">함께 보는 이야기, 취향은 각자의 방식으로.</p>

      <div class="profile-list">
        <div class="profile-card">
          <div class="box box-yulo">Y</div>
          <p class="name">율로</p>
          <p class="desc">나만의 영화 노트</p>
        </div>

        <div class="profile-card">
          <div class="box box-min">M</div>
          <p class="name">민</p>
          <p class="desc">오늘도 한 편</p>
        </div>

        <div class="profile-card">
          <div class="box box-jiho">J</div>
          <p class="name">지호</p>
          <p class="desc">새로운 장면을 찾아서</p>
        </div>

        <div class="profile-card">
          <div class="box box-guest">G</div>
          <p class="name">게스트</p>
          <p class="desc">가볍게 둘러보기</p>
        </div>
      </div>

      <button class="btn-manage">프로필 관리</button>
    </main>
  </body>
</html>
