<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/profile.css" />
    <title>Profile</title>
  </head>
  <body>
    <header>
      <h1>
        <a href="index.html">
          <img src="assets/images/NETFLEX identity.svg" alt="CINEMO 로고" />
        </a>
      </h1>
    </header>

    <main class="profile-container">
      <span class="badge">YOUR OWN SCENE</span>
      <h2>누구의 시간인가요?</h2>
      <p class="subtitle">함께 보는 이야기, 취향은 각자의 방식으로.</p>

      <div class="profile-list">
        <div class="profile-card">
          <div class="box box-yulo">
            <img src="assets/images/Avatar-y.svg" alt="율로 프로필" />
            <span class="avatar-text">Y</span>
          </div>
          <p class="name">율로</p>
          <p class="desc">나만의 영화 노트</p>
        </div>

        <div class="profile-card">
          <div class="box box-jiho">
            <img src="assets/images/Avatar-j.svg" alt="지호 프로필" />
            <span class="avatar-text">J</span>
          </div>
          <p class="name">지호</p>
          <p class="desc">새로운 장면을 찾아서</p>
        </div>

        <div class="profile-card">
          <div class="box box-min">
            <img src="assets/images/Avatar-m.svg" alt="민 프로필" />
            <span class="avatar-text">M</span>
          </div>
          <p class="name">민</p>
          <p class="desc">오늘도 한 편</p>
        </div>

        <div class="profile-card">
          <div class="box box-guest">
            <img src="assets/images/Avatar-g.svg" alt="게스트 프로필" />
            <span class="avatar-text">G</span>
          </div>
          <p class="name">게스트</p>
          <p class="desc">가볍게 둘러보기</p>
        </div>
      </div>

      <button class="btn-manage">
        <img src="assets/images/Vector.svg" alt="연필 아이콘" /> 프로필 관리
      </button>

      <footer class="profile-footer">
        <p>당신의 다음 장면을 만나는 곳, CINEMO</p>
      </footer>
    </main>
  </body>
</html>
